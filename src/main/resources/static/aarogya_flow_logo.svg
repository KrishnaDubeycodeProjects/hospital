<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #185a44;
      }
      .brand-tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #4b5d54;
      }
    </style>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 5)">
    <!-- Upper Circle Arc -->
    <path d="M 22 55 A 34 34 0 1 1 78 55" fill="none" stroke="#185a44" stroke-width="6" stroke-linecap="round" />

    <!-- Center Medical Cross in Red/Orange -->
    <rect x="44" y="24" width="12" height="32" rx="3" fill="#e0592b" />
    <rect x="34" y="34" width="32" height="12" rx="3" fill="#e0592b" />

    <!-- Left Cupped Hand / Leaf (Lime Green) -->
    <path d="M 16 48 C 14 62 20 78 38 86 C 44 89 46 84 41 81 C 31 74 25 64 24 49 C 23 42 16 40 16 48 Z" fill="#62a23e" />
    <path d="M 24 55 C 22 66 28 78 42 84 C 45 85 43 81 39 77 C 30 70 27 62 27 53 C 27 48 24 49 24 55 Z" fill="#4d862e" />

    <!-- Right Cupped Hand / Leaf (Dark Teal Green) -->
    <path d="M 84 48 C 86 62 80 78 62 86 C 56 89 54 84 59 81 C 69 74 75 64 76 49 C 77 42 84 40 84 48 Z" fill="#1d6e53" />
    <path d="M 76 55 C 78 66 72 78 58 84 C 55 85 57 81 61 77 C 70 70 73 62 73 53 C 73 48 76 49 76 55 Z" fill="#15553e" />
  </g>

  <!-- Brand Typography -->
  <text x="120" y="52" class="brand-title">Aarogya Flow</text>
  <text x="122" y="80" class="brand-tagline">Care Closer. Healthier Tomorrow.</text>
</svg>
