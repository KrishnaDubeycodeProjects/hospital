<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>Choose Department - Aarogya Flow</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#004D40',
              dark: '#00382e',
              emerald: '#059669',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-end sm:items-center sm:p-4">
  <!-- Exact React Book.jsx Department Picker Frame -->
  <main class="w-full max-w-md bg-white rounded-t-[28px] sm:rounded-[24px] shadow-2xl flex flex-col min-h-[580px] h-[92vh] max-h-[740px] overflow-hidden relative border border-slate-100">
    <!-- Top Drag Handle -->
    <div class="w-full flex justify-center pt-3 pb-1">
      <div aria-hidden="true" class="w-10 h-1.5 bg-slate-300 rounded-full"></div>
    </div>

    <!-- Header -->
    <header class="px-4 pt-2 pb-3 flex items-center justify-between border-b border-slate-100 bg-white">
      <button aria-label="Back" class="w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-700 active:scale-95 transition-transform" onclick="window.history.back()">
        <svg class="w-4 h-4 stroke-[2.4]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <div class="text-center flex-1 px-2">
        <h1 class="text-lg font-bold text-[#043c2c] leading-tight tracking-tight">Choose Department</h1>
        <p class="text-xs font-medium text-slate-500 mt-0.5">Select medical specialty for appointment</p>
      </div>
      <div class="w-9"></div>
    </header>

    <!-- Search Input Bar -->
    <div class="px-4 pt-3 pb-1">
      <div class="relative">
        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="deptSearch" placeholder="Search department, e.g. Cardiology, ENT..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#004D40]" oninput="filterDepartments(this.value)" />
      </div>
    </div>

    <!-- Scrollable Departments List -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3" id="deptsList">
      <!-- Popular categories will render here -->
    </div>
  </main>

  <script>
    let botPhone = '918850934544';
    fetch('/api/wa/config').then(r => r.json()).then(c => {
      if (c.botPhoneNumber) botPhone = c.botPhoneNumber.replace(/\D/g, '');
    }).catch(() => {});

    const departments = [
      { id: 'General Medicine', name: 'General Medicine', icon: '🩺', desc: 'Fever, checkup, general health, diabetes', color: '#E0F2FE', textColor: '#0284C7' },
      { id: 'Cardiology', name: 'Cardiology', icon: '❤️', desc: 'Heart care, chest pain, hypertension', color: '#FEE2E2', textColor: '#DC2626' },
      { id: 'Orthopedics', name: 'Orthopedics', icon: '🦴', desc: 'Joint pain, fractures, spine, bones', color: '#FEF3C7', textColor: '#D97706' },
      { id: 'Pediatrics', name: 'Pediatrics & Child Care', icon: '👶', desc: 'Child health, immunization, vaccinations', color: '#EDE9FE', textColor: '#7C3AED' },
      { id: 'Gynecology', name: 'Gynecology & Obstetrics', icon: '🌸', desc: 'Maternal health, prenatal, female wellness', color: '#FCE7F3', textColor: '#DB2777' },
      { id: 'ENT', name: 'ENT (Ear, Nose, Throat)', icon: '👂', desc: 'Hearing issues, sinus, throat infections', color: '#DCFCE7', textColor: '#059669' },
      { id: 'Ophthalmology', name: 'Ophthalmology (Eye Care)', icon: '👁️', desc: 'Vision testing, cataract, eye checkup', color: '#E0E7FF', textColor: '#4F46E5' },
      { id: 'Dermatology', name: 'Dermatology (Skin Care)', icon: '✨', desc: 'Allergies, rash, skin infections, hair', color: '#FFEDD5', textColor: '#EA580C' },
      { id: 'Neurology', name: 'Neurology', icon: '🧠', desc: 'Headache, migraines, nerve health', color: '#F3E8FF', textColor: '#9333EA' }
    ];

    function renderDepartments(list) {
      const container = document.getElementById('deptsList');
      container.innerHTML = list.map(d => `
        <div onclick="selectDept('${d.id}')" class="p-3.5 bg-white border border-slate-200 rounded-2xl flex items-center justify-between hover:border-[#004D40] hover:bg-slate-50 active:scale-[0.99] cursor-pointer transition-all shadow-sm">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shrink-0" style="background-color: ${d.color}">
              ${d.icon}
            </div>
            <div>
              <div class="text-[15px] font-bold text-slate-900 leading-tight">${d.name}</div>
              <div class="text-xs text-slate-500 font-normal mt-0.5">${d.desc}</div>
            </div>
          </div>
          <svg class="w-5 h-5 text-slate-400 stroke-[2] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </div>
      `).join('');
    }

    function filterDepartments(query) {
      const q = query.toLowerCase().trim();
      const filtered = departments.filter(d => d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q));
      renderDepartments(filtered);
    }

    function selectDept(deptId) {
      const returnMsg = encodeURIComponent(`#DEPT:${deptId}`);
      window.location.href = `https://wa.me/${botPhone}?text=${returnMsg}`;
    }

    renderDepartments(departments);
  </script>
</body>
</html>
