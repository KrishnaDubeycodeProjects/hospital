<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Patient Registration - Aarogya Flow</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0d5440',
              emerald: '#0e5f4a',
              lightGreen: '#ebfaf3',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 flex justify-center min-h-screen text-slate-800 antialiased font-sans sm:items-center sm:p-4">
  <main class="w-full max-w-md bg-white min-h-screen sm:min-h-[740px] sm:h-[92vh] sm:rounded-[24px] flex flex-col shadow-xl relative pb-6 overflow-x-hidden border border-slate-100">
    <!-- Drag handle -->
    <div class="w-full flex justify-center pt-3 pb-1">
      <div aria-hidden="true" class="w-10 h-1.5 bg-slate-300 rounded-full"></div>
    </div>

    <!-- Header -->
    <header class="px-5 pt-2 pb-3 flex items-center justify-between border-b border-gray-100 bg-white sticky top-0 z-20">
      <button aria-label="Go Back" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-slate-700 active:scale-95 transition-transform" onclick="window.history.back()">
        <svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <div class="text-center">
        <h1 class="text-base font-bold text-[#0c4e3f] leading-tight tracking-tight">1-Minute Registration</h1>
        <p class="text-[11px] font-medium text-slate-500">मरीज पंजीकरण • Aarogya Flow</p>
      </div>
      <div class="w-10"></div>
    </header>

    <!-- Content Area -->
    <div class="flex-1 px-5 pt-4 pb-6 flex flex-col gap-4 overflow-y-auto">
      <div class="bg-[#ebfaf3] border border-[#d6f2e4] rounded-2xl p-4 flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-[#cbeddc] flex items-center justify-center text-2xl text-[#0c4e3f] shrink-0">
          🏥
        </div>
        <div>
          <div class="text-sm font-bold text-[#0c4e3f]">Smart Rural Health Account</div>
          <div class="text-xs text-slate-600 mt-0.5">Enter details once to access fast OPD tokens, doctor slips, and family care.</div>
        </div>
      </div>

      <form id="regForm" onsubmit="handleRegistration(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">
            Full Name / पूरा नाम <span class="text-red-500">*</span>
          </label>
          <input type="text" id="fullName" required placeholder="e.g. Ramesh Patil" class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#004D40]" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">
              Age / उम्र <span class="text-red-500">*</span>
            </label>
            <input type="number" id="age" min="1" max="120" required placeholder="e.g. 32" class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#004D40]" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">
              Gender / लिंग <span class="text-red-500">*</span>
            </label>
            <select id="gender" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#004D40]">
              <option value="male">👨 Male / पुरुष</option>
              <option value="female">👩 Female / महिला</option>
              <option value="other">🧑 Other / अन्य</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">
            Mobile Number / मोबाइल नंबर
          </label>
          <input type="text" id="phoneInput" readonly class="w-full px-3.5 py-3 bg-slate-100 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 cursor-not-allowed" />
        </div>

        <button type="submit" id="submitBtn" class="w-full mt-4 py-3.5 px-4 bg-[#004D40] hover:bg-[#00382e] active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
          <span>Complete Registration & Return to WhatsApp</span>
        </button>
      </form>
    </div>

    <!-- React AyushmanFooter -->
    <footer class="p-4 border-t border-slate-100 bg-white">
      <div class="flex flex-col items-center text-center space-y-1 text-[11px] text-slate-500 font-medium select-none">
        <div class="flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5 text-[#00a86b] fill-current" viewBox="0 0 24 24">
            <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A9.49 9.49 0 0 0 12 21c7.73 0 10-9.86 10-13 0-1.5-1-2-2-2-1.74 0-4.3.56-6.68 1.45l2.45-2.45L14.36 3.59 10 7.95V10c1.7-.8 3.5-1.4 5-1.7-1 3-3 5.5-6 6.5l.7 1.8c4-1.5 6.5-5 7.3-8.6z"></path>
          </svg>
          <span class="font-bold text-[#054333]">Aarogya Flow</span>
          <span class="text-slate-300">|</span>
          <span class="text-slate-500">A rural health initiative</span>
        </div>
        <div class="flex items-center space-x-1 text-slate-500">
          <svg class="w-3 h-3 text-[#00b074] fill-current" viewBox="0 0 24 24">
            <rect height="5" rx="1" width="3.5" x="3" y="16"></rect>
            <rect height="10" rx="1" width="3.5" x="8.5" y="11"></rect>
            <rect height="15" opacity="0.3" rx="1" width="3.5" x="14" y="6"></rect>
            <rect height="19" opacity="0.3" rx="1" width="3.5" x="19.5" y="2"></rect>
          </svg>
          <span class="text-[11px]">Works even on low internet</span>
        </div>
      </div>
    </footer>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone') || '+918850934544';
    let botPhone = '918850934544';
    document.getElementById('phoneInput').value = phone;

    fetch('/api/wa/config').then(r => r.json()).then(c => {
      if (c.botPhoneNumber) botPhone = c.botPhoneNumber.replace(/\D/g, '');
    }).catch(() => {});

    async function handleRegistration(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Registering...';
      btn.disabled = true;

      const payload = {
        phone: phone.replace(/\D/g, ''),
        name: document.getElementById('fullName').value.trim(),
        age: parseInt(document.getElementById('age').value),
        gender: document.getElementById('gender').value
      };

      try {
        const res = await fetch('/api/wa/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.success !== false) {
          alert('Registration completed successfully!');
          window.location.href = `https://wa.me/${botPhone}?text=${encodeURIComponent('#REGISTERED:' + payload.name)}`;
        } else {
          alert(data.error || 'Registration failed. Please try again.');
        }
      } catch (err) {
        alert('Network error. Please try again.');
      } finally {
        btn.textContent = 'Complete Registration & Return to WhatsApp';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
