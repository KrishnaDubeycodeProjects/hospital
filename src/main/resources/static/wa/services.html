<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>Choose Service - Aarogya Flow</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#004D40' } }
        }
      }
    };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; background-color: #f1f5f9; }
    .card-active { transform: scale(0.99); transition: transform 0.1s; }
  </style>
</head>
<body class="min-h-screen flex justify-center items-end sm:items-center sm:p-4">
  <main class="w-full max-w-md bg-white rounded-t-[28px] sm:rounded-[24px] shadow-2xl flex flex-col h-[92vh] max-h-[740px] overflow-hidden border border-slate-200">
    <div class="w-10 h-1.5 bg-slate-300 rounded-full mx-auto mt-3 mb-1"></div>
    <header class="px-4 pt-2 pb-3 flex items-center justify-between border-b border-slate-100">
      <button class="w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center active:scale-95 transition-transform" onclick="returnToWhatsApp()">
        <svg class="w-4 h-4 stroke-[2.4]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
      <h1 class="text-[17px] font-bold text-[#004D40] tracking-tight" id="pageTitle">Aarogya Flow</h1>
      <div class="w-9"></div>
    </header>
    
    <div class="flex-1 overflow-y-auto p-4 space-y-3" id="servicesList">
      <!-- Populated by JS -->
    </div>
    
    <footer class="p-4 bg-white border-t border-slate-100 flex-shrink-0 space-y-2.5">
      <button id="btnContinue" onclick="handleContinue()" class="w-full py-3.5 bg-slate-200 text-slate-400 font-bold text-sm rounded-full transition-all flex items-center justify-center gap-2 active:scale-[0.99]" disabled>
        <span id="continueText">Continue</span>
      </button>
      
      <div class="text-center space-y-1 select-none pt-1">
        <div class="flex items-center justify-center gap-1.5 text-xs text-slate-600">
          <span>Powered by <strong class="text-[#004D40] font-bold">Aarogya Flow</strong></span>
        </div>
        <div class="flex items-center justify-center gap-1.5 text-[11px] text-slate-400">
          <span>Approved by Ayushman Bharat Digital Mission (ABDM)</span>
        </div>
      </div>
    </footer>
  </main>

  <script>
    let botPhone = '919120123877';
    let selectedService = null;
    const urlParams = new URLSearchParams(window.location.search);
    const lang = (urlParams.get('lang') || 'en').toLowerCase();

    fetch('/api/wa/config').then(r => r.json()).then(c => {
      if (c.botPhoneNumber) botPhone = c.botPhoneNumber.replace(/\D/g, '');
    }).catch(() => {});

    const strings = {
      en: { title: 'Choose Service', continue: 'Continue' },
      hi: { title: 'सेवा चुनें', continue: 'जारी रखें' },
      mr: { title: 'सेवा निवडा', continue: 'पुढे जा' }
    };

    document.getElementById('pageTitle').textContent = strings[lang]?.title || strings['en'].title;
    document.getElementById('continueText').textContent = strings[lang]?.continue || strings['en'].continue;

    const services = [
      { id: 'srv_appointment', icon: '🏥', title: 'OPD Appointment', sub: 'Book visit & track live turn', hi: 'ओपीडी अपॉइंटमेंट', hiSub: 'विजिट बुक करें व बारी ट्रैक करें', mr: 'ओपीडी अपॉइंटमेंट', mrSub: 'भेट बुक करा व पाळी ट्रॅक करा', badgeBg: 'bg-blue-100', textCol: 'text-blue-700' },
      { id: 'srv_family_abha', icon: '👨‍👩‍👧', title: 'Family & ABHA', sub: 'Manage family & link Ayushman card', hi: 'परिवार और आभा', hiSub: 'परिवार जोड़ें व आयुष्मान कार्ड लिंक करें', mr: 'कुटुंब आणि आभा', mrSub: 'कुटुंब जोडा व आयुष्मान कार्ड लिंक करा', badgeBg: 'bg-pink-100', textCol: 'text-pink-700' },
      { id: 'srv_health_records', icon: '💊', title: 'Health Records', sub: 'View & upload prescriptions, labs', hi: 'स्वास्थ्य रिकॉर्ड', hiSub: 'पर्चे व लैब रिपोर्ट देखें व अपलोड करें', mr: 'आरोग्य रेकॉर्ड', mrSub: 'प्रिस्क्रिप्शन व रिपोर्ट पहा आणि अपलोड करा', badgeBg: 'bg-purple-100', textCol: 'text-purple-700' },
      { id: 'srv_referrals', icon: '📋', title: 'Referral Follow-ups', sub: 'Doctor referral status & history', hi: 'रेफरल फॉलो-अप', hiSub: 'डॉक्टर रेफरल स्थिति व इतिहास', mr: 'रेफरल फॉलो-अप', mrSub: 'डॉक्टर रेफरल स्थिती व इतिहास', badgeBg: 'bg-orange-100', textCol: 'text-orange-700' },
      { id: 'srv_lang_change', icon: '🌐', title: 'Change Language', sub: 'English, हिन्दी, मराठी', hi: 'भाषा बदलें', hiSub: 'English, हिन्दी, मराठी', mr: 'भाषा बदला', mrSub: 'English, हिन्दी, मराठी', badgeBg: 'bg-slate-100', textCol: 'text-slate-700', light: true }
    ];

    function renderServices() {
      const container = document.getElementById('servicesList');
      container.innerHTML = services.map(s => {
        const isSelected = selectedService === s.id;
        const displayTitle = lang === 'hi' ? s.hi : (lang === 'mr' ? s.mr : s.title);
        const displaySub = lang === 'hi' ? s.hiSub : (lang === 'mr' ? s.mrSub : s.sub);
        const activeClass = isSelected ? 'border-[#004D40] bg-emerald-50/70 shadow-md ring-2 ring-[#004D40]/20' : 'border-slate-200 bg-white shadow-sm';
        const ring = isSelected ? '<div class="w-6 h-6 rounded-full bg-[#004D40] text-white flex items-center justify-center flex-shrink-0 shadow-sm"><svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' : '<div class="w-6 h-6 rounded-full border-2 border-slate-300 flex-shrink-0"></div>';
        
        return `
          <div onclick="selectService('${s.id}')" class="p-3.5 border ${activeClass} rounded-2xl flex items-center justify-between cursor-pointer transition-all active:scale-[0.99] gap-3">
            <div class="flex items-center gap-3.5 min-w-0">
              <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl ${s.badgeBg} ${s.textCol} shadow-sm border border-black/5 flex-shrink-0">${s.icon}</div>
              <div class="min-w-0">
                <div class="text-[16px] font-extrabold text-slate-900 tracking-tight leading-snug truncate">${displayTitle}</div>
                <div class="text-[12px] font-medium text-slate-500 truncate mt-0.5">${displaySub}</div>
              </div>
            </div>
            ${ring}
          </div>
        `;
      }).join('');
    }

    function selectService(id) {
      selectedService = id;
      renderServices();
      const btn = document.getElementById('btnContinue');
      btn.disabled = false;
      btn.classList.remove('bg-slate-200', 'text-slate-400');
      btn.classList.add('bg-[#004D40]', 'text-white');
    }

    function handleContinue() {
      if (selectedService) {
        const msg = encodeURIComponent(`#SERVICE:${selectedService}`);
        window.location.href = `https://wa.me/${botPhone}?text=${msg}`;
      }
    }

    function returnToWhatsApp() {
      window.location.href = `https://wa.me/${botPhone}`;
    }

    renderServices();
  </script>
</body>
</html>
