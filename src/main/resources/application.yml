server:
  port: ${PORT:8088}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SERVER_SSL_KEY_ALIAS:}

spring:
  application:
    name: clinic-queue-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:postgres}?sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Don't fail application startup if the DB is unreachable at boot time -
      # mirrors the original Node app, which logs a warning and keeps serving
      # even when the DB is briefly unavailable.
      initialization-fail-timeout: -1
      connection-timeout: 5000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      add-mappings: true
  servlet:
    multipart:
      # Spring Boot defaults to 1MB, which would reject prescription/report photo
      # uploads well under PatientDocumentService's own 8MB cap -- give it headroom.
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      # This app has no JPA/Hibernate entities anywhere (plain NamedParameterJdbcTemplate
      # throughout -- see JdbcConfig), so there's nothing for ddl-auto to generate DDL
      # from. Schema instead comes from src/main/resources/schema.sql -- but applied by
      # config/SchemaInitRunner, NOT Spring Boot's own auto-configured SQL initializer:
      # that initializer's continue-on-error only covers failures *within* the script,
      # not a failed-to-connect DB at boot, which it treats as fatal and crashes the
      # whole application context. SchemaInitRunner instead swallows any failure (DB
      # unreachable, or a bad statement) exactly like the old FlywayMigrationRunner did,
      # so a DB outage at startup is logged and doesn't take the app down with it.
      mode: never

# Application-specific settings. Most env var names deliberately match the
# original Node backend's .env; see README for the security-hardening additions.
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  clinic-name: ${CLINIC_NAME:qDischarge}
  token-expiry-hours: ${TOKEN_EXPIRY_HOURS:24}
  avg-service-minutes: ${AVG_SERVICE_MINUTES:10}

  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:adminpass}
  admin-password-hash: ${ADMIN_PASSWORD_HASH:}
  jwt-secret: ${JWT_SECRET:}
  jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:720}

  webhook-verify-token: ${WEBHOOK_VERIFY_TOKEN:clinic_queue_token}
  allowed-origins: ${ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}

  # WhatsApp provider: 'meta' (Meta Cloud API) or 'evolution' (Evolution API)
  wa-provider: ${WA_PROVIDER:meta}
  meta-access-token: ${META_ACCESS_TOKEN:}
  meta-phone-number-id: ${META_PHONE_NUMBER_ID:1337438019442398}
  meta-api-version: ${META_API_VERSION:v25.0}

  evolution-api-url: ${EVOLUTION_API_URL:http://localhost:8080}
  evolution-api-key: ${EVOLUTION_API_KEY:}
  instance-name: ${INSTANCE_NAME:clinic-bot}

  rate-limit-login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
  rate-limit-webhook-per-minute: ${RATE_LIMIT_WEBHOOK_PER_MINUTE:120}
  rate-limit-create-token-per-minute: ${RATE_LIMIT_CREATE_TOKEN_PER_MINUTE:20}

  async-core-pool-size: ${ASYNC_CORE_POOL_SIZE:4}
  async-max-pool-size: ${ASYNC_MAX_POOL_SIZE:16}
  async-queue-capacity: ${ASYNC_QUEUE_CAPACITY:500}

  # Distance -> ETA fallback (see geo/GeoDistanceService; used only when TomTom is unavailable)
  geo-avg-speed-kmh: ${GEO_AVG_SPEED_KMH:25}

  # Real routing ETA (TomTom) vs. queue treatment-time-remaining, anomaly-control
  # grace window, and the "head to the hospital now" voice call (see
  # geo/TomTomRoutingService, service/TreatmentTimingScheduler, service/TwilioStudioCallService).
  # Blank TOMTOM_API_KEY -> falls back to the haversine estimate above instead of failing booking.
  tomtom-api-key: ${TOMTOM_API_KEY:}
  twilio-studio-flow-sid: ${TWILIO_STUDIO_FLOW_SID:FWdummy00000000000000000000000000}
  twilio-caller-number: ${TWILIO_CALLER_NUMBER:}
  twilio-call-enabled: ${TWILIO_CALL_ENABLED:false}
  twilio-voice-tone: ${TWILIO_VOICE_TONE:neutral}
  notify-buffer-minutes: ${NOTIFY_BUFFER_MINUTES:2}
  timing-poll-interval-ms: ${TIMING_POLL_INTERVAL_MS:15000}

  # Default single hospital, seeded into the "hospitals" table on first migration.
  # Location can be given as a DIGIPIN, or as lat/lon (a DIGIPIN is then derived).
  hospital-uri-slug: ${HOSPITAL_URI_SLUG:main}
  hospital-digipin: ${HOSPITAL_DIGIPIN:}
  hospital-latitude: ${HOSPITAL_LATITUDE:}
  hospital-longitude: ${HOSPITAL_LONGITUDE:}
  hospital-open-time: ${HOSPITAL_OPEN_TIME:09:00}
  hospital-close-time: ${HOSPITAL_CLOSE_TIME:17:00}
  hospital-active-counters: ${HOSPITAL_ACTIVE_COUNTERS:1}

  # OTP verification: 'log' logs the code instead of sending an SMS (dev
  # default, no Twilio account needed); 'twilio' delegates generation/expiry/
  # matching entirely to Twilio's Verify API; 'twilio-sms' self-generates the
  # code (like 'log') and sends it via Twilio's plain Messages API through a
  # Messaging Service instead.
  otp-provider: ${OTP_PROVIDER:log}
  otp-required-for-registration: ${OTP_REQUIRED_FOR_REGISTRATION:false}
  twilio-account-sid: ${TWILIO_ACCOUNT_SID:ACdummy0000000000000000000000000}
  twilio-auth-token: ${TWILIO_AUTH_TOKEN:dummy_auth_token}
  twilio-verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:VAdummy00000000000000000000000000}
  twilio-messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  otp-ttl-minutes: ${OTP_TTL_MINUTES:10}
  rate-limit-otp-per-minute: ${RATE_LIMIT_OTP_PER_MINUTE:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      # Exposes /actuator/health/liveness (process is alive -- ignores DB)
      # and /actuator/health/readiness (DB reachable). Point container/
      # orchestrator restart policies at liveness and load-balancer routing
      # at readiness, so a transient DB outage doesn't kill healthy instances.
      probes:
        enabled: true
  health:
    defaults:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com.qdischarge.clinicqueue: INFO
