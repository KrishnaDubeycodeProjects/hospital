server:
  port: ${PORT:8089}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]

  application:
    name: asha-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:postgres}?sslmode=${DB_SSL_MODE:prefer}&prepareThreshold=0&currentSchema=${DB_SCHEMA:clinicqueue}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:720}
  allowed-origins: ${ALLOWED_ORIGINS:*}
