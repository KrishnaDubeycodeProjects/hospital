server:
  port: ${PORT:8089}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:250}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:25}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:200}
    connection-timeout: 20000

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]

  application:
    name: asha-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:postgres}?sslmode=${DB_SSL_MODE:prefer}&prepareThreshold=0&currentSchema=${DB_SCHEMA:clinicqueue}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:50}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      idle-timeout: 60000
      max-lifetime: 180000

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:720}
  allowed-origins: ${ALLOWED_ORIGINS:*}
