# ==============================================================================
# Nginx Reverse Proxy Configuration for n8n + Education WhatsApp Bot + Admin Panel
# ==============================================================================

# Upstream n8n server (running locally or inside Docker on port 5678)
upstream n8n_backend {
    server 127.0.0.1:5678;
    keepalive 64;
}

# Upstream Admin Dashboard & Webhook Relay server (running on port 3000)
upstream admin_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com; # Replace with your domain or VPS public IP

    # -------------------------------------------------------------
    # 1. Admin Dashboard (HTML panel & REST API)
    # -------------------------------------------------------------
    location /admin {
        proxy_pass http://admin_backend/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://admin_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # 2. n8n Webhook Endpoints (Meta WhatsApp, Razorpay, etc.)
    # -------------------------------------------------------------
    location /webhook/ {
        proxy_pass http://n8n_backend/webhook/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for instant webhook streaming & immediate 200 OK ack
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Test webhook endpoint in n8n
    location /webhook-test/ {
        proxy_pass http://n8n_backend/webhook-test/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # -------------------------------------------------------------
    # 3. n8n Editor UI & Server-Sent Events (SSE / WebSockets)
    # -------------------------------------------------------------
    location / {
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;

        # Essential headers for n8n WebSockets and Live Editor Canvas
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
