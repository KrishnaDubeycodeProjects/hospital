<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>Hospitals - Aarogya Flow</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { DEFAULT: '#004D40' } } } } };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; background-color: #f1f5f9; }
  </style>
</head>
<body class="min-h-screen flex justify-center items-end sm:items-center sm:p-4">
  <main class="w-full max-w-md bg-white rounded-t-[28px] sm:rounded-[24px] shadow-2xl flex flex-col h-[92vh] max-h-[740px] overflow-hidden border border-slate-200">
    <div class="w-10 h-1.5 bg-slate-300 rounded-full mx-auto mt-3 mb-1"></div>
    <header class="px-4 pt-2 pb-3 flex items-center justify-between border-b border-slate-100">
      <button class="w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center active:scale-95 transition-transform" onclick="window.history.back()">
        <svg class="w-4 h-4 stroke-[2.4]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
      </button>
      <h1 class="text-[17px] font-bold text-[#004D40]" id="headerTitle">Find Hospitals</h1>
      <div class="w-9"></div>
    </header>

    <div class="p-3 border-b border-slate-100 bg-white space-y-2">
      <input type="text" id="searchBar" placeholder="Search hospitals..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#004D40]" oninput="filterList(this.value)">
      <div id="locContainer" class="hidden">
        <button onclick="requestLocation()" class="w-full py-2 bg-blue-50 text-blue-700 font-bold text-sm rounded-xl flex justify-center items-center gap-2 active:scale-95">
          📍 Share Location
        </button>
      </div>
    </div>
    
    <div class="flex-1 overflow-y-auto p-4 space-y-3" id="contentArea">
      <div class="flex justify-center py-10">
        <div class="w-6 h-6 border-2 border-[#004D40] border-t-transparent rounded-full animate-spin"></div>
      </div>
    </div>
    
    <footer class="p-4 bg-white border-t border-slate-100">
      <div class="text-center">
        <div class="text-xs text-slate-600">Powered by <strong class="text-[#004D40]">Aarogya Flow</strong></div>
        <div class="text-[11px] text-slate-400">Approved by Ayushman Bharat Digital Mission (ABDM)</div>
      </div>
    </footer>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';
    const phone = urlParams.get('phone') || '';
    const category = urlParams.get('category') || '';
    let lat = urlParams.get('lat') || '';
    let lon = urlParams.get('lon') || '';
    const lang = (urlParams.get('lang') || 'en').toLowerCase();
    
    let botPhone = '919120123877';
    let allHospitals = [];

    fetch('/api/wa/config').then(r => r.json()).then(c => {
      if (c.botPhoneNumber) botPhone = c.botPhoneNumber.replace(/\D/g, '');
    }).catch(() => {});

    const strings = {
      en: { title: 'Find Hospitals', loc: '📍 Share Location', empty: 'No hospitals found.', err: 'Something went wrong.', retry: 'Retry', book: 'Book Here →' },
      hi: { title: 'अस्पताल खोजें', loc: '📍 लोकेशन शेयर करें', empty: 'कोई अस्पताल नहीं मिला।', err: 'कुछ गलत हो गया।', retry: 'पुनः प्रयास', book: 'यहाँ बुक करें →' },
      mr: { title: 'रुग्णालये शोधा', loc: '📍 लोकेशन शेअर करा', empty: 'कोणतेही रुग्णालय आढळले नाही.', err: 'काहीतरी चुकले.', retry: 'पुन्हा प्रयत्न', book: 'येथे बुक करा →' }
    };
    
    document.getElementById('headerTitle').textContent = strings[lang]?.title || strings['en'].title;
    
    function getEmoji(name) {
      const n = name.toLowerCase();
      if(n.includes('govt') || n.includes('civil') || n.includes('district')) return '🏛️';
      if(n.includes('clinic')) return '🏪';
      if(n.includes('maternity') || n.includes('mahila')) return '🌺';
      if(n.includes('children') || n.includes('bal')) return '👶';
      if(n.includes('eye') || n.includes('netra')) return '👁️';
      if(n.includes('cardiac') || n.includes('heart')) return '❤️';
      return '🏥';
    }

    async function loadHospitals() {
      const c = document.getElementById('contentArea');
      c.innerHTML = `<div class="flex justify-center py-10"><div class="w-6 h-6 border-2 border-[#004D40] border-t-transparent rounded-full animate-spin"></div></div>`;
      
      if (!lat || !lon) {
        document.getElementById('locContainer').classList.remove('hidden');
        document.querySelector('#locContainer button').textContent = strings[lang]?.loc || strings['en'].loc;
      } else {
        document.getElementById('locContainer').classList.add('hidden');
      }

      try {
        let url = `/api/wa/hospitals/search?token=${encodeURIComponent(token)}&category=${encodeURIComponent(category)}`;
        if (lat && lon) url += `&lat=${lat}&lon=${lon}`;
        
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error('Fetch failed');
        let data = await res.json();
        if(!Array.isArray(data)) data = data.data || [];
        allHospitals = data;
        renderList(allHospitals);
      } catch (err) {
        c.innerHTML = `
          <div class="text-center py-10">
            <div class="text-sm text-red-500 mb-3">${strings[lang]?.err || strings['en'].err}</div>
            <button onclick="loadHospitals()" class="px-4 py-2 bg-slate-200 rounded-lg text-sm font-bold">${strings[lang]?.retry || strings['en'].retry}</button>
          </div>
        `;
      }
    }

    function renderList(list) {
      const c = document.getElementById('contentArea');
      if (list.length === 0) {
        c.innerHTML = `<div class="text-center py-10 text-sm text-slate-500">${strings[lang]?.empty || strings['en'].empty}</div>`;
        return;
      }
      const now = new Date();
      const currTime = now.getHours() * 60 + now.getMinutes();

      c.innerHTML = list.map(h => {
        const emoji = getEmoji(h.name);
        let distBadge = h.distance ? `<span class="px-2 py-0.5 text-[11px] font-bold bg-blue-100 text-blue-700 rounded-full">📏 ${h.distance} km</span>` : '';
        
        let isOpen = false;
        if(h.openTime && h.closeTime) {
          const [oh, om] = h.openTime.split(':').map(Number);
          const [ch, cm] = h.closeTime.split(':').map(Number);
          const openMins = oh * 60 + (om||0);
          const closeMins = ch * 60 + (cm||0);
          if (currTime >= openMins && currTime <= closeMins) isOpen = true;
        }
        const statusBadge = isOpen ? `<span class="px-2 py-0.5 text-[11px] font-bold bg-emerald-100 text-emerald-700 rounded-full">OPD Open ✅</span>` : `<span class="px-2 py-0.5 text-[11px] font-bold bg-red-100 text-red-700 rounded-full">OPD Closed ❌</span>`;

        return `
          <div class="p-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-2">
            <div class="flex justify-between items-start">
              <div class="flex gap-2">
                <div class="text-2xl">${emoji}</div>
                <div>
                  <div class="text-[14px] font-bold text-slate-900 leading-tight">${h.name}</div>
                  <div class="text-[11px] text-slate-500 truncate w-48">${h.address || ''}</div>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2 mt-1">
              ${distBadge}
              ${statusBadge}
            </div>
            <button onclick="bookHospital('${h.id}')" class="w-full mt-2 py-2.5 bg-[#004D40] text-white text-xs font-bold rounded-xl active:scale-[0.99] transition-transform">
              ${strings[lang]?.book || strings['en'].book}
            </button>
          </div>
        `;
      }).join('');
    }

    function filterList(val) {
      const q = val.toLowerCase();
      renderList(allHospitals.filter(h => h.name.toLowerCase().includes(q) || (h.address||'').toLowerCase().includes(q)));
    }

    function requestLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          lat = pos.coords.latitude;
          lon = pos.coords.longitude;
          loadHospitals();
        }, () => alert('Location access denied'));
      }
    }

    function bookHospital(id) {
      const msg = encodeURIComponent(`#HOSP:${id}`);
      window.location.href = `https://wa.me/${botPhone}?text=${msg}`;
    }

    loadHospitals();
  </script>
</body>
</html>
