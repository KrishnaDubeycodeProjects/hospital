<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Medical Documents - Aarogya Flow</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0d5440',
              emerald: '#0e5f4a',
              lightGreen: '#ebfaf3',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
  </style>
</head>
<body class="bg-gray-100 flex justify-center min-h-screen text-slate-800 antialiased font-sans sm:items-center sm:p-4">
  <main class="w-full max-w-md bg-white min-h-screen sm:min-h-[740px] sm:h-[92vh] sm:rounded-[24px] flex flex-col shadow-xl relative pb-6 overflow-x-hidden border border-slate-100">
    <!-- Top Drag Handle -->
    <div class="w-full flex justify-center pt-3 pb-1">
      <div aria-hidden="true" class="w-10 h-1.5 bg-slate-300 rounded-full"></div>
    </div>

    <!-- Header -->
    <header class="px-5 pt-2 pb-3.5 flex items-center justify-between border-b border-gray-100 bg-white sticky top-0 z-20">
      <button aria-label="Go Back" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-slate-700 active:scale-95 transition-transform" onclick="window.history.back()">
        <svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <div class="text-center">
        <h1 class="text-lg font-bold text-[#0c4e3f] leading-tight tracking-tight">Medical Documents</h1>
        <p class="text-xs font-medium text-slate-500" id="phoneDisplay">+91 88509 34544</p>
      </div>
      <button aria-label="Upload" class="w-10 h-10 rounded-full bg-[#ebfaf3] text-[#0e5f4a] flex items-center justify-center active:scale-95 transition-transform" onclick="openUploadModal()">
        <svg class="w-5 h-5 stroke-[2.4]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
    </header>

    <!-- Content Area (Clean, Minimalist, Real DB data) -->
    <div class="flex-1 px-4 pt-3 pb-4 flex flex-col gap-3.5 overflow-y-auto">
      <!-- Member Switch Card -->
      <div class="bg-[#eefbf5] border border-[#d6f2e4] rounded-2xl p-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-full bg-[#cbeddc] flex items-center justify-center text-[#0c4e3f] font-bold text-sm">
            👤
          </div>
          <div>
            <div class="font-bold text-slate-800 text-[14.5px]" id="patientNameDisplay">Kavish Ahuja</div>
            <span class="text-xs text-emerald-800 font-semibold">Active Member</span>
          </div>
        </div>
        <button class="flex items-center gap-1 text-xs font-semibold text-[#0c4e3f] bg-white px-3 py-1.5 rounded-xl border border-[#cbeddc] active:scale-95 transition-transform" onclick="switchMember()">
          <span>Switch</span>
          <svg class="w-3 h-3 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M19.5 8.25l-7.5 7.5-7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>

      <!-- Real Documents List from Database -->
      <div class="space-y-3 pt-1" id="docsContainer">
        <div class="py-12 text-center text-xs text-slate-400">Loading documents from database...</div>
      </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-100">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
          <h3 class="text-base font-bold text-slate-900">Upload Doctor Slip / Report</h3>
          <button class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 text-sm font-bold" onclick="closeUploadModal()">✕</button>
        </div>
        <form onsubmit="handleUpload(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Document Category</label>
            <select id="docCategory" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none">
              <option value="PRESCRIPTION">💊 Prescription / Doctor Slip</option>
              <option value="LAB_REPORT">🔬 Lab / Blood Test Report</option>
              <option value="DISCHARGE_SUMMARY">📋 Hospital Discharge Slip</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Choose Photo or PDF</label>
            <input type="file" id="fileUploadInput" accept="image/*,application/pdf" required class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#ebfaf3] file:text-[#0e5f4a]" />
          </div>
          <button type="submit" class="w-full py-3 rounded-xl bg-[#005d43] text-white font-semibold text-xs" id="uploadBtn">Upload to Health Record</button>
        </form>
      </div>
    </div>

    <!-- React AyushmanFooter -->
    <footer class="p-4 border-t border-slate-100 bg-white">
      <div class="flex flex-col items-center text-center space-y-1 text-[11px] text-slate-500 font-medium select-none">
        <div class="flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5 text-[#00a86b] fill-current" viewBox="0 0 24 24">
            <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A9.49 9.49 0 0 0 12 21c7.73 0 10-9.86 10-13 0-1.5-1-2-2-2-1.74 0-4.3.56-6.68 1.45l2.45-2.45L14.36 3.59 10 7.95V10c1.7-.8 3.5-1.4 5-1.7-1 3-3 5.5-6 6.5l.7 1.8c4-1.5 6.5-5 7.3-8.6z"></path>
          </svg>
          <span class="font-bold text-[#054333]">Aarogya Flow</span>
          <span class="text-slate-300">|</span>
          <span class="text-slate-500">A rural health initiative</span>
        </div>
        <div class="flex items-center space-x-1 text-slate-500">
          <svg class="w-3 h-3 text-[#00b074] fill-current" viewBox="0 0 24 24">
            <rect height="5" rx="1" width="3.5" x="3" y="16"></rect>
            <rect height="10" rx="1" width="3.5" x="8.5" y="11"></rect>
            <rect height="15" opacity="0.3" rx="1" width="3.5" x="14" y="6"></rect>
            <rect height="19" opacity="0.3" rx="1" width="3.5" x="19.5" y="2"></rect>
          </svg>
          <span class="text-[11px]">Works even on low internet</span>
        </div>
      </div>
    </footer>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone') || '+918850934544';
    let botPhone = '919120123877';
    document.getElementById('phoneDisplay').textContent = phone;

    fetch('/api/wa/config').then(r => r.json()).then(c => {
      if (c.botPhoneNumber) botPhone = c.botPhoneNumber.replace(/\D/g, '');
    }).catch(() => {});

    async function loadDocumentsFromDb() {
      try {
        const cleanPhone = phone.replace(/\D/g, '');
        // Try dedicated WhatsApp WebView documents endpoint first, then public fallback
        let res = await fetch(`/api/wa/documents?phone=${encodeURIComponent(cleanPhone)}`);
        if (!res.ok) {
          res = await fetch(`/api/patients/public/documents?phone=${encodeURIComponent(cleanPhone)}`);
        }
        if (res.ok) {
          const result = await res.json();
          const list = Array.isArray(result) ? result : (result.data || []);
          if (list.length > 0) {
            renderDocs(list);
            return;
          }
        }
      } catch (err) {
        console.warn('Documents DB load error:', err);
      }
      renderEmptyState();
    }

    function renderDocs(list) {
      const c = document.getElementById('docsContainer');
      c.innerHTML = list.map(d => {
        let icon = '📄';
        const t = (d.docType || d.documentType || '').toLowerCase();
        if (t.includes('prescription')) icon = '💊';
        else if (t.includes('report') || t.includes('lab')) icon = '🔬';
        else if (t.includes('summary') || t.includes('discharge')) icon = '📋';

        const dateStr = d.createdAt ? new Date(d.createdAt).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) : 'Recent';
        const docTitle = d.fileName || d.title || 'Medical Record';
        const docTypeLabel = t.includes('prescription') ? 'Prescription' : (t.includes('report') ? 'Lab Report' : 'Medical Record');

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-2xl bg-[#ebfaf3] text-lg flex items-center justify-center shrink-0">
                ${icon}
              </div>
              <div class="max-w-[210px]">
                <div class="text-[14px] font-bold text-slate-900 leading-snug truncate" title="${docTitle}">${docTitle}</div>
                <div class="text-xs text-slate-500 font-medium">${docTypeLabel} • ${dateStr}</div>
              </div>
            </div>
            <a href="/api/wa/documents/${d.id}/file" target="_blank" class="px-3 py-1.5 bg-emerald-50 text-[#0c4e3f] border border-emerald-200 font-semibold text-xs rounded-xl hover:bg-emerald-100 active:scale-95 transition-all">
              View
            </a>
          </div>
        `;
      }).join('');
    }

    function renderEmptyState() {
      const c = document.getElementById('docsContainer');
      c.innerHTML = `
        <div class="text-center py-12 px-4 space-y-3">
          <div class="text-4xl">📁</div>
          <h3 class="text-base font-bold text-slate-800">No Medical Documents Yet</h3>
          <p class="text-xs text-slate-500 max-w-xs mx-auto leading-relaxed">
            Keep doctor prescriptions and lab reports safe here. Tap the + icon at the top right to upload.
          </p>
        </div>
      `;
    }

    function openUploadModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
      document.getElementById('uploadModal').classList.add('flex');
    }

    function closeUploadModal() {
      document.getElementById('uploadModal').classList.add('hidden');
      document.getElementById('uploadModal').classList.remove('flex');
    }

    async function handleUpload(e) {
      e.preventDefault();
      const fileInput = document.getElementById('fileUploadInput');
      if (!fileInput.files || fileInput.files.length === 0) return;

      const patientName = document.getElementById('patientNameDisplay').textContent || 'Self';
      const cleanPhone = phone.replace(/\D/g, '');
      const selectedType = document.getElementById('docCategory').value;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('phone', cleanPhone);
      formData.append('name', patientName);
      formData.append('patientName', patientName);
      formData.append('docType', selectedType);
      formData.append('type', selectedType);

      const btn = document.getElementById('uploadBtn');
      btn.textContent = 'Uploading...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/wa/documents/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success !== false) {
          alert('Document uploaded successfully to your health vault!');
          closeUploadModal();
          fileInput.value = '';
          loadDocumentsFromDb();
        } else {
          alert(data.error || 'Upload failed. Please try again.');
        }
      } catch (err) {
        alert('Network error. Please try again.');
      } finally {
        btn.textContent = 'Upload to Health Record';
        btn.disabled = false;
      }
    }

    function switchMember() {
      window.location.href = `https://wa.me/${botPhone}?text=${encodeURIComponent('switch member')}`;
    }

    loadDocumentsFromDb();
  </script>
</body>
</html>
