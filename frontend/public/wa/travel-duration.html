<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>Travel Duration - Aarogya Flow</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#015c45',
              dark: '#014534',
              emerald: '#00674d',
              mint: '#eaf6f0',
              accentGreen: '#005b41'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: #e2e8f0;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #015c45;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(1, 92, 69, 0.4);
      border: 3px solid #ffffff;
      transition: transform 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.15);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-end sm:items-center sm:p-4">
  <main class="w-full max-w-md bg-white rounded-t-[28px] sm:rounded-[24px] shadow-2xl flex flex-col min-h-[520px] h-[85vh] max-h-[640px] overflow-hidden relative border border-slate-100">
    <!-- Top Drag Handle -->
    <div class="w-full flex justify-center pt-3 pb-1">
      <div aria-hidden="true" class="w-10 h-1.5 bg-slate-300 rounded-full"></div>
    </div>

    <!-- Header -->
    <header class="px-5 py-3 flex items-center justify-between border-b border-slate-100 relative">
      <button aria-label="Close" class="p-1 -ml-1 text-slate-700 hover:text-slate-900 active:scale-95 transition-transform" onclick="window.history.back()" type="button">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <h1 class="text-base font-bold text-slate-900 absolute left-1/2 -translate-x-1/2">
        Travel Duration
      </h1>
      <div class="w-6"></div>
    </header>

    <!-- Content (Clean, Minimalist, No arrival timestamps, No clutter) -->
    <div class="flex-1 overflow-y-auto px-6 pt-6 pb-4 flex flex-col justify-center space-y-6">
      <div class="text-center space-y-1">
        <h2 class="text-lg font-bold text-slate-900">How long will it take you to reach?</h2>
        <p class="text-xs text-slate-500 font-medium">Slide to choose your travel time to the clinic</p>
      </div>

      <!-- Selected Minutes Hero Number -->
      <div class="bg-[#f0fdf4] border border-[#dcfce7] rounded-3xl p-6 text-center flex flex-col items-center shadow-sm">
        <div class="flex items-baseline justify-center gap-1.5 my-1">
          <span class="text-6xl font-black text-[#015c45]" id="selectedMinutesVal">25</span>
          <span class="text-xl font-bold text-[#014534]">min</span>
        </div>
        <span class="text-xs text-emerald-800 font-semibold mt-1">Travel time selected</span>
      </div>

      <!-- Range Slider with min/max labels from API -->
      <div class="space-y-2 pt-2 px-1">
        <input type="range" id="travelSlider" min="15" max="45" value="25" oninput="updateTravelSelection(this.value)" />
        <div class="flex items-center justify-between text-xs text-slate-400 font-semibold px-1">
          <span>Min: <strong id="minDisplay" class="text-slate-700">15 min</strong></span>
          <span>Max: <strong id="maxDisplay" class="text-slate-700">45 min</strong></span>
        </div>
      </div>
    </div>

    <!-- Sticky Footer with Confirm button and React AyushmanFooter -->
    <footer class="p-5 pt-3 pb-6 border-t border-slate-100 bg-white space-y-3">
      <button class="w-full py-3.5 px-4 bg-[#005d43] hover:bg-[#004e38] active:scale-[0.99] text-white font-semibold text-sm rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 focus:outline-none" type="button" onclick="confirmSelection()">
        <span>Confirm Travel Time</span>
      </button>

      <!-- React AyushmanFooter Component -->
      <div class="flex flex-col items-center text-center space-y-1 pt-1 text-[11px] text-slate-500 font-medium select-none">
        <div class="flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5 text-[#00a86b] fill-current" viewBox="0 0 24 24">
            <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A9.49 9.49 0 0 0 12 21c7.73 0 10-9.86 10-13 0-1.5-1-2-2-2-1.74 0-4.3.56-6.68 1.45l2.45-2.45L14.36 3.59 10 7.95V10c1.7-.8 3.5-1.4 5-1.7-1 3-3 5.5-6 6.5l.7 1.8c4-1.5 6.5-5 7.3-8.6z"></path>
          </svg>
          <span class="font-bold text-[#054333]">Aarogya Flow</span>
          <span class="text-slate-300">|</span>
          <span class="text-slate-500">A rural health initiative</span>
        </div>
        <div class="flex items-center space-x-1 text-slate-500">
          <svg class="w-3 h-3 text-[#00b074] fill-current" viewBox="0 0 24 24">
            <rect height="5" rx="1" width="3.5" x="3" y="16"></rect>
            <rect height="10" rx="1" width="3.5" x="8.5" y="11"></rect>
            <rect height="15" opacity="0.3" rx="1" width="3.5" x="14" y="6"></rect>
            <rect height="19" opacity="0.3" rx="1" width="3.5" x="19.5" y="2"></rect>
          </svg>
          <span class="text-[11px]">Works even on low internet</span>
        </div>
      </div>
    </footer>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const hospitalId = params.get('hospitalId') || '1';
    const lat = params.get('lat') || '19.0760';
    const lon = params.get('lon') || '72.8777';
    let selectedMins = 25;
    let botPhone = '918850934544';

    fetch('/api/wa/config').then(r => r.json()).then(c => {
      if (c.botPhoneNumber) botPhone = c.botPhoneNumber.replace(/\D/g, '');
    }).catch(() => {});

    // Fetch real range from API
    async function loadRangeFromApi() {
      try {
        const res = await fetch(`/api/queue/travel-range?hospitalId=${hospitalId}&latitude=${lat}&longitude=${lon}`);
        if (res.ok) {
          const data = await res.json();
          const minVal = data.minMinutes || 15;
          const maxVal = data.maxMinutes || 45;
          const baseVal = data.baseMinutes || 25;

          document.getElementById('minDisplay').textContent = `${minVal} min`;
          document.getElementById('maxDisplay').textContent = `${maxVal} min`;

          const slider = document.getElementById('travelSlider');
          slider.min = minVal;
          slider.max = maxVal;
          slider.value = baseVal;
          updateTravelSelection(baseVal);
          return;
        }
      } catch (err) {
        console.warn('API travel range error:', err);
      }
      updateTravelSelection(25);
    }

    function updateTravelSelection(val) {
      selectedMins = val;
      document.getElementById('selectedMinutesVal').textContent = val;
    }

    function confirmSelection() {
      const returnMsg = encodeURIComponent(`#TRAVEL:${selectedMins}`);
      window.location.href = `https://wa.me/${botPhone}?text=${returnMsg}`;
    }

    loadRangeFromApi();
  </script>
</body>
</html>
