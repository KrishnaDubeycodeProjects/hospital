<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>Your Response - Aarogya Flow</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            whatsapp: {
              teal: '#00A884',
              tealDark: '#008069',
              lightGreen: '#E7FCE8',
            },
            surface: {
              subtle: '#F8FAFC',
              border: '#E2E8F0',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style data-purpose="custom-styling">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-end sm:items-center sm:p-4">
  <main class="w-full max-w-md bg-white rounded-t-[28px] sm:rounded-[24px] shadow-2xl flex flex-col min-h-[580px] h-[92vh] max-h-[740px] overflow-hidden relative border border-slate-100" data-purpose="response-sheet">
    <!-- Top Drag Handle -->
    <div class="w-full flex justify-center pt-3 pb-1" data-purpose="drag-indicator-wrapper">
      <div aria-hidden="true" class="w-10 h-1.5 bg-slate-300 rounded-full"></div>
    </div>

    <!-- SheetHeader -->
    <header class="px-5 py-3 flex items-center justify-between border-b border-slate-100 relative">
      <button aria-label="Close" class="p-1 -ml-1 text-slate-700 hover:text-slate-900 active:scale-95 transition-transform focus:outline-none" onclick="returnToBot()" type="button">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <h1 class="text-base font-semibold text-slate-900 absolute left-1/2 -translate-x-1/2 select-none">
        Your response
      </h1>
      <div aria-hidden="true" class="w-6"></div>
    </header>

    <!-- SheetBodyContent -->
    <div class="flex-1 overflow-y-auto px-6 pt-7 pb-4 space-y-6">
      <div class="flex items-center justify-between" data-purpose="scheme-header">
        <span class="text-base font-bold text-slate-900 tracking-tight" id="schemeTitle">
          Aarogya Flow
        </span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-whatsapp-teal border border-emerald-100/70">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 16 16">
            <path clip-rule="evenodd" d="M12.416 3.376a.75.75 0 0 1 .208 1.04l-5 7.5a.75.75 0 0 1-1.154.114l-3-3a.75.75 0 0 1 1.06-1.06l2.353 2.353 4.493-6.74a.75.75 0 0 1 1.04-.207Z" fill-rule="evenodd"></path>
          </svg>
          Recorded
        </span>
      </div>

      <!-- Real Response Details from Database -->
      <div class="space-y-6 pt-1" data-purpose="response-details">
        <div class="group border-b border-slate-50 pb-4">
          <p class="text-[13px] font-normal text-slate-500 tracking-normal mb-1">
            Patient Name
          </p>
          <p class="text-base font-medium text-slate-900 leading-snug" id="respPatient">
            Loading patient record...
          </p>
        </div>

        <div class="group border-b border-slate-50 pb-4">
          <p class="text-[13px] font-normal text-slate-500 tracking-normal mb-1">
            Clinical Department
          </p>
          <p class="text-base font-medium text-slate-900 leading-snug" id="respDept">
            Loading department...
          </p>
        </div>

        <div class="group border-b border-slate-50 pb-4">
          <p class="text-[13px] font-normal text-slate-500 tracking-normal mb-1">
            Hospital Facility
          </p>
          <p class="text-base font-medium text-slate-900 leading-snug" id="respHospital">
            Loading hospital...
          </p>
        </div>

        <div class="group">
          <p class="text-[13px] font-normal text-slate-500 tracking-normal mb-1">
            Appointment Status
          </p>
          <p class="text-base font-semibold text-emerald-700 leading-snug" id="respStatus">
            Confirmed ✅
          </p>
        </div>
      </div>
    </div>

    <!-- SheetFooterAction with React AyushmanFooter -->
    <footer class="p-5 pt-3 pb-6 border-t border-slate-100 bg-white space-y-3">
      <button class="w-full py-3.5 px-4 bg-whatsapp-teal hover:bg-whatsapp-tealDark active:scale-[0.99] text-white font-semibold text-sm rounded-xl shadow-sm shadow-emerald-700/10 transition-all flex items-center justify-center gap-2 focus:outline-none" type="button" onclick="returnToBot()">
        <span>Return to WhatsApp Chat</span>
      </button>

      <!-- React AyushmanFooter Component -->
      <div class="flex flex-col items-center text-center space-y-1 pt-1 text-[11px] text-slate-500 font-medium select-none">
        <div class="flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5 text-[#00a86b] fill-current" viewBox="0 0 24 24">
            <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A9.49 9.49 0 0 0 12 21c7.73 0 10-9.86 10-13 0-1.5-1-2-2-2-1.74 0-4.3.56-6.68 1.45l2.45-2.45L14.36 3.59 10 7.95V10c1.7-.8 3.5-1.4 5-1.7-1 3-3 5.5-6 6.5l.7 1.8c4-1.5 6.5-5 7.3-8.6z"></path>
          </svg>
          <span class="font-bold text-[#054333]">Aarogya Flow</span>
          <span class="text-slate-300">|</span>
          <span class="text-slate-500">A rural health initiative</span>
        </div>
        <div class="flex items-center space-x-1 text-slate-500">
          <svg class="w-3 h-3 text-[#00b074] fill-current" viewBox="0 0 24 24">
            <rect height="5" rx="1" width="3.5" x="3" y="16"></rect>
            <rect height="10" rx="1" width="3.5" x="8.5" y="11"></rect>
            <rect height="15" opacity="0.3" rx="1" width="3.5" x="14" y="6"></rect>
            <rect height="19" opacity="0.3" rx="1" width="3.5" x="19.5" y="2"></rect>
          </svg>
          <span class="text-[11px]">Works even on low internet</span>
        </div>
      </div>
    </footer>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const phone = params.get('phone') || '+918850934544';
    let patientName = params.get('name');
    let deptName = params.get('dept');
    let hospName = params.get('hosp');
    let travelTime = params.get('time');
    let botPhone = '919120123877';

    fetch('/api/wa/config').then(r => r.json()).then(c => {
      if (c.botPhoneNumber) botPhone = c.botPhoneNumber.replace(/\D/g, '');
    }).catch(() => {});

    // Fetch real data from database if params not fully passed
    async function loadRealData() {
      try {
        if (!patientName || !deptName || !hospName) {
          const cleanPhone = phone.replace(/\s+/g, '');
          const res = await fetch(`/api/queue/position?phone=${encodeURIComponent(cleanPhone)}`);
          if (res.ok) {
            const data = await res.json();
            if (data) {
              patientName = data.name || data.patientName || patientName;
              deptName = data.category || data.department || deptName;
              hospName = data.hospitalName || hospName;
              // data loaded
            }
          }
        }
      } catch (err) {
        console.warn('DB record load error:', err);
      } finally {
        document.getElementById('respPatient').textContent = patientName || 'Registered Patient';
        document.getElementById('respDept').textContent = deptName || 'General Medicine';
        document.getElementById('respHospital').textContent = hospName || 'Aastha Hospital';
        const stEl = document.getElementById('respStatus');
        if (stEl) stEl.textContent = 'Confirmed ✅';
      }
    }

    function returnToBot() {
      const returnMsg = encodeURIComponent(`Confirmed: ${patientName || 'Patient'} for ${deptName || 'Consultation'} at ${hospName || 'Hospital'}`);
      window.location.href = `https://wa.me/${botPhone}?text=${returnMsg}`;
    }

    loadRealData();
  </script>
</body>
</html>
