<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>Choose Service - Aarogya Flow</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#004D40',
              dark: '#043c2c',
              emerald: '#00A884',
              sky: '#0284c7'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #f1f5f9;
    }
    .service-card {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .service-card:active {
      transform: scale(0.985);
    }
    .service-card.selected {
      border-color: #005d43;
      background-color: #f0fdf4;
      box-shadow: 0 4px 12px rgba(0, 93, 67, 0.08);
    }
    .btn-continue-active {
      background-color: #005d43 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(0, 93, 67, 0.25);
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-end sm:items-center sm:p-4">
  <!-- Exact React Landing.jsx Phone Frame -->
  <main class="w-full max-w-md bg-white rounded-t-[28px] sm:rounded-[28px] shadow-2xl flex flex-col h-[94vh] sm:h-[880px] max-h-[100dvh] overflow-hidden relative border border-slate-200">
    
    <!-- Top Drag Handle Bar -->
    <div class="w-full flex justify-center pt-3 pb-1" data-purpose="drag-handle-bar">
      <div aria-hidden="true" class="w-10 h-1.5 bg-slate-300 rounded-full"></div>
    </div>

    <!-- 1. Top App Bar (Header): Close (X) on left, Aarogya Flow center, kebab menu on right -->
    <header class="px-4 py-2.5 flex items-center justify-between border-b border-slate-100 bg-white">
      <button aria-label="Close" class="w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-700 active:scale-95 transition-transform" onclick="returnToWhatsApp()">
        <svg class="w-4 h-4 stroke-[2.4]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <h1 class="text-[17px] font-bold text-[#043c2c] tracking-tight">
        Aarogya Flow
      </h1>

      <div class="relative">
        <button aria-label="More options" class="w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-700 active:scale-95 transition-transform" onclick="toggleMenu()">
          <svg class="w-5 h-5 fill-slate-700" viewBox="0 0 24 24">
            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
          </svg>
        </button>

        <div id="quickMenu" class="hidden absolute right-0 mt-2 w-48 bg-white border border-slate-200 rounded-2xl shadow-xl py-1 z-30">
          <a href="javascript:void(0)" onclick="directNav('hospitals')" class="flex items-center gap-2.5 px-3.5 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50">
            <svg class="w-4 h-4 stroke-[2] text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Nearby OPDs</span>
          </a>
          <a href="javascript:void(0)" onclick="directNav('track')" class="flex items-center gap-2.5 px-3.5 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50">
            <svg class="w-4 h-4 stroke-[2] text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Live Queue Tracker</span>
          </a>
          <a href="javascript:void(0)" onclick="directNav('records')" class="flex items-center gap-2.5 px-3.5 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50">
            <svg class="w-4 h-4 stroke-[2] text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Health Vault</span>
          </a>
          <div class="h-px bg-slate-100 my-1"></div>
          <a href="javascript:void(0)" onclick="returnToWhatsApp()" class="flex items-center gap-2.5 px-3.5 py-2 text-xs font-medium text-emerald-700 hover:bg-emerald-50">
            <span>💬 Back to WhatsApp</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Scrollable Content Area -->
    <div class="flex-1 overflow-y-auto px-4 py-3 space-y-4" id="mainContent">
      
      <!-- 2. Hero Banner: Aarogya Flow official illustration -->
      <section class="w-full rounded-2xl overflow-hidden shadow-sm border border-slate-100 bg-[#f8fafc]">
        <img
          src="/aarogya_flow_banner.png"
          alt="Aarogya Flow: Care Closer. Healthier Tomorrow."
          class="w-full h-auto object-cover block"
          onerror="this.onerror=null; this.src='/footer_area.png';"
        />
      </section>

      <!-- 3. Choose Service Selector Header & Card -->
      <section class="w-full space-y-2.5">
        <button
          type="button"
          id="selectorTrigger"
          onclick="toggleSelector()"
          class="w-full px-4 py-3.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-2xl flex items-center justify-between transition-all"
        >
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="selectorText" class="text-sm font-semibold text-slate-700">Choose your service</span>
          </div>
          <svg id="chevronIcon" class="w-4 h-4 text-slate-400 stroke-[2.2] transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>

        <!-- Service Cards List -->
        <div id="servicesList" class="space-y-2.5">
          <!-- Populated by JavaScript -->
        </div>
      </section>
    </div>

    <!-- 4. Sticky Bottom Section: Continue Button + Ayushman Trust Footer -->
    <footer class="p-4 bg-white border-t border-slate-100 flex-shrink-0 space-y-2.5">
      <button
        type="button"
        id="btnContinue"
        onclick="handleContinue()"
        class="w-full py-3.5 px-4 bg-slate-200 text-slate-400 font-bold text-sm rounded-full transition-all flex items-center justify-center gap-2 cursor-pointer shadow-sm active:scale-[0.99]"
      >
        <span>Continue</span>
        <svg class="w-4 h-4 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>

      <!-- 2-Line Ayushman Bharat Trust Footer (matching AyushmanFooter.jsx) -->
      <div class="text-center space-y-1 select-none pt-1">
        <div class="flex items-center justify-center gap-1.5 text-xs text-slate-600">
          <svg class="w-3.5 h-3.5 fill-[#16a34a] shrink-0" viewBox="0 0 24 24">
            <path d="M17 3c-4.5.5-8 4-8.5 8.5C8 10 6.5 8 3 8c0 5.5 3.5 10 9 10 0 2-1 3-2 3h4c0-2 1-4 3-6 4-4 4.5-9.5 0-12z" />
          </svg>
          <span>
            A rural health initiative <span class="text-slate-300 mx-0.5">|</span> Powered by <strong class="text-[#043c2c] font-bold">Aarogya Flow</strong>
          </span>
        </div>
        <div class="flex items-center justify-center gap-1.5 text-[11px] text-slate-400">
          <svg class="w-3.5 h-3.5 text-emerald-600 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>Approved by Ayushman Bharat Digital Mission (ABDM)</span>
        </div>
      </div>
    </footer>
  </main>

  <script>
    // Configuration & State
    let botPhone = '919120123877';
    let selectedService = null;
    let selectorExpanded = true;

    // Parse URL params
    const urlParams = new URLSearchParams(window.location.search);
    const userPhone = urlParams.get('phone') || '';
    const userToken = urlParams.get('token') || '';
    const userLang = (urlParams.get('lang') || 'en').toLowerCase();

    fetch('/api/wa/config').then(r => r.json()).then(c => {
      if (c.botPhoneNumber) botPhone = c.botPhoneNumber.replace(/\D/g, '');
    }).catch(() => {});

    // Five Core Services matching React Landing.jsx with icons and subtitles
    const services = [
      {
        id: 'book',
        title: userLang === 'hi' ? 'ओपीडी टोकन बुक करें' : (userLang === 'mr' ? 'ओपीडी टोकन बुक करा' : 'Book OPD Token'),
        subtitle: userLang === 'hi' ? 'अपने नजदीकी अस्पताल में कतार से जुड़ें' : (userLang === 'mr' ? 'जवळच्या रुग्णालयात रांगेत सामील व्हा' : 'Join queue at a hospital near you'),
        badgeBg: '#E0F2FE',
        badgeColor: '#0284C7',
        url: '/wa/departments.html',
        icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                 <line x1="16" y1="2" x2="16" y2="6" />
                 <line x1="8" y1="2" x2="8" y2="6" />
                 <line x1="3" y1="10" x2="21" y2="10" />
                 <path d="m9 16 2 2 4-4" />
               </svg>`
      },
      {
        id: 'track',
        title: userLang === 'hi' ? 'लाइव टोकन ट्रैक करें' : (userLang === 'mr' ? 'थेट टोकन तपासा' : 'Track My Turn'),
        subtitle: userLang === 'hi' ? 'कतार में अपनी स्थिति और प्रतीक्षा समय देखें' : (userLang === 'mr' ? 'थेट रांगेतील स्थान आणि प्रतीक्षा वेळ पहा' : 'Check live queue position & wait time'),
        badgeBg: '#FFEDD5',
        badgeColor: '#EA580C',
        url: '/wa/track.html',
        icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <circle cx="12" cy="12" r="10" />
                 <polyline points="12 6 12 12 16 14" />
               </svg>`
      },
      {
        id: 'records',
        title: userLang === 'hi' ? 'मेरे स्वास्थ्य रिकॉर्ड' : (userLang === 'mr' ? 'माझे आरोग्य रेकॉर्ड' : 'My Health Records'),
        subtitle: userLang === 'hi' ? 'पर्चे, लैब रिपोर्ट और रेफरल पर्ची' : (userLang === 'mr' ? 'प्रिस्क्रिप्शन, लॅब अहवाल आणि रेफरल' : 'Prescriptions, lab reports, referrals'),
        badgeBg: '#F3E8FF',
        badgeColor: '#7C3AED',
        url: '/wa/documents.html',
        icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                 <polyline points="14 2 14 8 20 8" />
                 <line x1="16" y1="13" x2="8" y2="13" />
                 <line x1="16" y1="17" x2="8" y2="17" />
                 <polyline points="10 9 9 9 8 9" />
               </svg>`
      },
      {
        id: 'hospitals',
        title: userLang === 'hi' ? 'अस्पताल खोजें' : (userLang === 'mr' ? 'रुग्णालये शोधा' : 'Find Hospitals'),
        subtitle: userLang === 'hi' ? 'लाइव कतार स्थिति के साथ नजदीकी ओपीडी' : (userLang === 'mr' ? 'थेट रांग स्थितीसह जवळची ओपीडी' : 'Nearby OPDs with live queue status'),
        badgeBg: '#DCFCE7',
        badgeColor: '#059669',
        url: '/wa/hospitals.html',
        icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0H5m14 0h2m-16 0H3m6-12h6m-3-3v6" />
               </svg>`
      },
      {
        id: 'family',
        title: userLang === 'hi' ? 'परिवार और आभा (ABHA)' : (userLang === 'mr' ? 'कुटुंब आणि आभा (ABHA)' : 'Family & ABHA'),
        subtitle: userLang === 'hi' ? 'परिवार के सदस्य जोड़ें और आयुष्मान कार्ड लिंक करें' : (userLang === 'mr' ? 'कुटुंब व्यवस्थापन आणि आयुष्मान कार्ड लिंक करा' : 'Manage family & link Ayushman card'),
        badgeBg: '#FFE4E6',
        badgeColor: '#E11D48',
        url: '/wa/family.html',
        icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                 <circle cx="9" cy="7" r="4" />
                 <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                 <path d="M16 3.13a4 4 0 0 1 0 7.75" />
               </svg>`
      }
    ];

    function renderServices() {
      const container = document.getElementById('servicesList');
      container.innerHTML = services.map(s => {
        const isSelected = selectedService === s.id;
        return `
          <div
            id="card-${s.id}"
            onclick="selectService('${s.id}')"
            class="service-card p-3.5 bg-white border border-slate-200 rounded-2xl flex items-center justify-between hover:border-[#004D40] hover:bg-slate-50 cursor-pointer shadow-sm ${isSelected ? 'selected' : ''}"
          >
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 shadow-xs" style="background-color: ${s.badgeBg};">
                ${s.icon}
              </div>
              <div>
                <div class="text-[15px] font-bold text-slate-900 leading-tight">${s.title}</div>
                <div class="text-xs text-slate-500 font-normal mt-0.5">${s.subtitle}</div>
              </div>
            </div>

            <div class="flex items-center pl-2">
              ${isSelected ? `
                <div class="w-6 h-6 rounded-full bg-[#005d43] text-white flex items-center justify-center">
                  <svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </div>
              ` : `
                <svg class="w-5 h-5 text-slate-300 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <polyline points="9 18 15 12 9 6" />
                </svg>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function selectService(id) {
      selectedService = id;
      const s = services.find(item => item.id === id);
      if (s) {
        document.getElementById('selectorText').textContent = s.title;
        document.getElementById('selectorText').classList.add('text-[#043c2c]', 'font-bold');
      }

      // Activate Continue Button
      const btn = document.getElementById('btnContinue');
      btn.classList.add('btn-continue-active');

      renderServices();
    }

    function toggleSelector() {
      selectorExpanded = !selectorExpanded;
      const list = document.getElementById('servicesList');
      const icon = document.getElementById('chevronIcon');
      if (selectorExpanded) {
        list.classList.remove('hidden');
        icon.classList.add('rotate-90');
      } else {
        list.classList.add('hidden');
        icon.classList.remove('rotate-90');
      }
    }

    function handleContinue() {
      if (!selectedService) {
        // default select first service
        selectService('book');
        return;
      }
      directNav(selectedService);
    }

    function directNav(serviceId) {
      const s = services.find(item => item.id === serviceId);
      if (!s) return;

      // Pass forward token, phone, and lang parameters
      const params = new URLSearchParams();
      if (userPhone) params.append('phone', userPhone);
      if (userToken) params.append('token', userToken);
      if (userLang) params.append('lang', userLang);
      if (serviceId === 'track') params.append('key', userPhone.replace(/\D/g, ''));
      if (serviceId === 'family') params.append('action', 'manage');
      if (serviceId === 'hospitals') params.append('category', 'General OPD');

      const targetUrl = `${s.url}?${params.toString()}`;
      window.location.href = targetUrl;
    }

    function returnToWhatsApp() {
      if (selectedService) {
        const returnMsg = encodeURIComponent(`#SERVICE:${selectedService}`);
        window.location.href = `https://wa.me/${botPhone}?text=${returnMsg}`;
      } else {
        window.location.href = `https://wa.me/${botPhone}`;
      }
    }

    function toggleMenu() {
      const m = document.getElementById('quickMenu');
      m.classList.toggle('hidden');
    }

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('quickMenu');
      if (!menu.contains(e.target) && !e.target.closest('button[aria-label="More options"]')) {
        menu.classList.add('hidden');
      }
    });

    // Initial render
    renderServices();
    document.getElementById('chevronIcon').classList.add('rotate-90');
  </script>
</body>
</html>
